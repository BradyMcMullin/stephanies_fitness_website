        /* CSS Styling */
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e74c3c;
            --bg-color: #f8f9fa;
            --text-color: #333;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            color: var(--text-color);
            background-color: var(--bg-color);
            line-height: 1.6;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        nav {

            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .logo-ss {
            color: var(--accent-color);
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 0;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;

            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        .hero {

            padding: 100px 20px;
        }

            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto 30px auto;
        }

        .btn {

            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s;
            font-weight: bold;
            text-transform: uppercase;
        }

        .btn:hover {
            background-color: #c0392b;
        }

        section {
            padding: 60px 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

            color: var(--primary-color);
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

            max-width: 800px;
            margin: 0 auto;
            font-size: 1.1rem;
        }

        .services-grid {

            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
